name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package with dev tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Pyright
        run: pyright

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with dev tools
        run: python -m pip install -e ".[dev]"
      # On Ubuntu a Linux Docker daemon answers, so the Docker sandbox tests run
      # (the image is built from its pinned recipe on first use) and the
      # benchmark uses the Docker sandbox; Windows runners use the local one.
      - name: Tests
        run: python -m pytest -q
      - name: Regenerate the deterministic benchmark (fails if any task fails)
        run: python scripts/run_benchmark.py --sandbox auto
      - name: Regenerate the jail-attack evidence for the local sandbox (fails on any breach)
        run: python scripts/run_jail_attacks.py --backend local
      - name: Regenerate the jail-attack evidence for the Docker sandbox
        if: runner.os == 'Linux'
        run: python scripts/run_jail_attacks.py --backend docker
      - name: Committed results must be reproduced exactly
        run: git diff --exit-code results/
